<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NOUF AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>

        body {
            margin: 0;
            overflow: hidden;
        }

    </style>

</head>

<body>

    <a-scene
        renderer="colorManagement: true; physicallyCorrectLights: true"
        vr-mode-ui="enabled: true"
        embedded>

        <a-assets>

            <a-asset-item
                id="noufModel"
                src="NOUF31.glb">
            </a-asset-item>

        </a-assets>


        <a-camera
            position="0 0 0"
            look-controls="enabled: true">
        </a-camera>


        <a-entity
            id="model"
            gltf-model="#noufModel"
            visible="false"
            scale="1 1 1"
            position="0 0 0">
        </a-entity>


        <a-light
            type="ambient"
            intensity="2">
        </a-light>


        <a-light
            type="directional"
            intensity="2"
            position="1 4 2">
        </a-light>

    </a-scene>


    <script>

        const model = document.querySelector("#model");

        let placed = false;

        model.addEventListener("model-loaded", () => {

            console.log("NOUF31.glb loaded successfully");

        });

        model.addEventListener("model-error", (error) => {

            console.error("Could not load NOUF31.glb", error);

        });


        document.querySelector("a-scene").addEventListener(
            "enter-vr",
            async () => {

                const scene = document.querySelector("a-scene");

                if (!navigator.xr) {

                    alert("WebXR is not supported on this device/browser.");

                    return;

                }

                try {

                    const session = scene.renderer.xr.getSession();

                    console.log("AR session started");

                } catch (error) {

                    console.error(error);

                }

            }
        );


        window.addEventListener("click", () => {

            if (!placed) {

                model.setAttribute(
                    "position",
                    "0 0 -2"
                );

                model.setAttribute(
                    "visible",
                    true
                );

                placed = true;

            }

        });

    </script>

</body>

</html>
